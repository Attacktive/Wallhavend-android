name: 'Release'
on:
  push:
    tags: ['**']

jobs:
  release:
    name: 'Release'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v6'

      - name: 'Set up JDK'
        uses: 'actions/setup-java@v5'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 'Decode keystore'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: 'Build release APK and AAB'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: './gradlew assembleRelease bundleRelease'

      - name: 'Rename artifacts'
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-${{ github.ref_name }}.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/app-release-${{ github.ref_name }}.aab

      - name: 'Upload APK to GitHub Releases'
        uses: 'softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b'
        with:
          files: |
            app/build/outputs/apk/release/app-release-${{ github.ref_name }}.apk
            app/build/outputs/bundle/release/app-release-${{ github.ref_name }}.aab
          generate_release_notes: true

