name: 'Release'
on:
  push:
    tags: ['**']

jobs:
  release:
    name: 'Release'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0

      - name: 'Set up JDK'
        uses: 'actions/setup-java@v5'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 'Decode keystore'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: 'Build release APK and AAB'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: './gradlew assembleRelease bundleRelease'

      - name: 'Rename artifacts'
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Wallhavend-${{ github.ref_name }}.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Wallhavend-${{ github.ref_name }}.aab

      - name: 'Generate release notes'
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="${{ github.ref_name }}" --jq '.body')
          {
            echo 'body<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 'Upload APK to GitHub Releases'
        uses: 'softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b'
        with:
          files: |
            app/build/outputs/apk/release/Wallhavend-${{ github.ref_name }}.apk
            app/build/outputs/bundle/release/Wallhavend-${{ github.ref_name }}.aab
          generate_release_notes: true

      - name: 'Create whatsnew file'
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.body }}
        run: |
          mkdir -p whatsnew
          NOTES=$(printf '%s' "$RELEASE_NOTES" \
            | sed '/^## What'\''s Changed$/d' \
            | sed 's/ by @[^ ]* in [^ ]*//g' \
            | sed '/^\*\*Full Changelog\*\*:/d' \
            | sed '/^[[:space:]]*$/d')

          if [ -z "$NOTES" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 '${{ github.ref_name }}^' 2>/dev/null || true)
            if [ -n "$PREVIOUS_TAG" ]; then
              RANGE="$PREVIOUS_TAG..${{ github.ref_name }}"
            else
              RANGE='${{ github.ref_name }}'
            fi

            NOTES=$(git log "$RANGE" --pretty='- %s' | grep -v '^- chore: bump version' || true)
          fi

          printf '%s' "$NOTES" | head -c 500 > whatsnew/whatsnew-en-US

      - name: 'Upload AAB to Google Play'
        uses: 'r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5'
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: 'xyz.attacktive.wallhavend'
          releaseFiles: 'app/build/outputs/bundle/release/Wallhavend-${{ github.ref_name }}.aab'
          mappingFile: 'app/build/outputs/mapping/release/mapping.txt'
          debugSymbols: 'app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip'
          whatsNewDirectory: 'whatsnew'
          tracks: 'beta'
          status: 'completed'
