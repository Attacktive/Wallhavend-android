name: 'Promote to production'
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Beta version to promote. Blank = latest completed beta.'
        required: false
        type: 'string'
  repository_dispatch:
    types: ['agent-broker-workflow']

concurrency:
  group: 'production-promotion'
  cancel-in-progress: false

jobs:
  promote:
    name: 'Promote beta to production'
    runs-on: 'ubuntu-latest'
    permissions:
      # scripts/release-notes.sh uses GitHub's generated-notes endpoint, which requires write access.
      contents: 'write'
    steps:
      - name: 'Validate broker dispatch'
        if: github.event_name == 'repository_dispatch'
        env:
          BROKER_REF: ${{ github.event.client_payload.ref }}
          BROKER_WORKFLOW: ${{ github.event.client_payload.workflow }}
        run: |
          test "${BROKER_WORKFLOW}" = 'promote-production.yaml'
          test "${BROKER_REF}" = 'main'

      - name: 'Checkout'
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0
          ref: 'refs/heads/main'

      - name: 'Promote exact beta artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TARGET_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.inputs.target_version || inputs.target_version }}
        run: 'bash scripts/promote-production.sh'
