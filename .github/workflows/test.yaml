name: 'Test'
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
permissions:
  contents: 'read'
jobs:
  test:
    name: 'Test'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'
      - name: 'Test production release eligibility'
        run: |
          bash -n scripts/promote-production.sh scripts/play-release-state.sh
          bash scripts/play-release-state.test.sh
      - name: 'Set up JDK'
        uses: 'actions/setup-java@v6'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: 'Unit tests'
        run: './gradlew test'
      - name: 'Android lint'
        run: './gradlew lint'
      - name: 'Detekt'
        run: './gradlew detekt'
